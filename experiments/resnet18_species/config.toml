# Paths in this file are relative to the repository root.
experiment = "resnet18_species"

[data]
data_dir = "PlantCLEF2015TrainingData"
split_file = "results/data/plantclef2015/v1/split_manifest.csv"

[model]
architecture = "resnet18"
tasks = ["species"]
weights = "imagenet"

[training]
epochs = 5
batch_size = 16
seed = 20260910
lr = 0.0001
weight_decay = 0.0001

[runtime]
device = "auto"
num_threads = 6

[output]
run_root = "results/runs"

[selection]
task = "species"
metric = "macro_f1"

[preprocessing]
resize_size = 256
crop_size = 224
mean = [0.485, 0.456, 0.406]
std = [0.229, 0.224, 0.225]
interpolation = "bilinear"
antialias = true

[augmentation]
horizontal_flip = 0.5
vertical_flip = 0.5
